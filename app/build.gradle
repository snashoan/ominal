plugins {
    id "com.android.application"
}

ext {
    ominalAppPackageName = "com.ominal"

    // The packageVariant defines the bootstrap variant that will be included in the app APK.
    // This must be supported by com.ominal.shared.runtime.OminalBootstrap.PackageVariant or app will
    // crash at startup.
    // Bootstrap of a different variant must not be manually installed by the user after app installation
    // by replacing $PREFIX since app code is dependant on the variant used to build the APK.
    // Currently supported values are: [ "apt-android-7" "apt-android-5" ]
    packageVariant = System.getenv("OMINAL_PACKAGE_VARIANT") ?: "apt-android-7" // Default: "apt-android-7"
}

def localBootstrapsValue = System.getenv("OMINAL_USE_LOCAL_BOOTSTRAPS")
def useLocalOminalBootstraps = localBootstrapsValue != null
    ? localBootstrapsValue.equals("1") || localBootstrapsValue.equalsIgnoreCase("true")
    : project.ext.ominalAppPackageName == "com.ominal"

def releaseSigningPropertiesFile = rootProject.file(".signing/keystore.properties")
def releaseSigningProperties = new Properties()
if (releaseSigningPropertiesFile.exists()) {
    releaseSigningPropertiesFile.withInputStream { releaseSigningProperties.load(it) }
}
def releaseSigningPropertyNames = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
def hasReleaseSigning = releaseSigningPropertyNames.every {
    releaseSigningProperties.getProperty(it)?.trim()
}
def runtimeDelivery = (project.findProperty("ominalRuntimeDelivery")
    ?: System.getenv("OMINAL_RUNTIME_DELIVERY") ?: "legacy").toString()
def preparedRootfsUrl = (project.findProperty("ominalPreparedRootfsUrl")
    ?: System.getenv("OMINAL_PREPARED_ROOTFS_URL") ?: "").toString()
def preparedRootfsSha256 = (project.findProperty("ominalPreparedRootfsSha256")
    ?: System.getenv("OMINAL_PREPARED_ROOTFS_SHA256") ?: "").toString().toLowerCase(Locale.ROOT)
def preparedRootfsAsset = "runtime/archives/ominal-ubuntu-24.04.4-arm64-prepared-v3.tgz"
def versionPropertiesFile = rootProject.file("version.properties")
if (!versionPropertiesFile.isFile()) {
    throw new GradleException("Missing canonical version file: " + versionPropertiesFile)
}
def versionProperties = new Properties()
versionPropertiesFile.withInputStream { versionProperties.load(it) }
def configuredVersionCode = versionProperties.getProperty("versionCode", "").trim()
def appVersionName = versionProperties.getProperty("versionName", "").trim()
def requestedVersionCode = (project.findProperty("ominalAppVersionCode")
    ?: System.getenv("OMINAL_APP_VERSION_CODE") ?: "").toString().trim()
def requestedVersionName = (project.findProperty("ominalAppVersionName")
    ?: System.getenv("OMINAL_APP_VERSION_NAME") ?: "").toString().trim()
if (requestedVersionCode && requestedVersionCode != configuredVersionCode) {
    throw new GradleException("Version code overrides are not allowed. Update version.properties.")
}
if (requestedVersionName && requestedVersionName != appVersionName) {
    throw new GradleException("Version name overrides are not allowed. Update version.properties.")
}
def ominalBootstrapAarch64 = file("src/main/cpp/bootstrap-aarch64.zip")
def generatedOminalJniLibs = layout.buildDirectory.dir("generated/ominal-jni-libs")
def generatedProotLoader = generatedOminalJniLibs.map {
    it.file("arm64-v8a/libominal-proot-loader.so")
}
def appVersionCode
try {
    appVersionCode = configuredVersionCode.toInteger()
} catch (NumberFormatException ignored) {
    throw new GradleException("Ominal app version code must be a positive integer: " + configuredVersionCode)
}
if (appVersionCode <= 0) {
    throw new GradleException("Ominal app version code must be a positive integer: " + configuredVersionCode)
}
if (!(runtimeDelivery in ["legacy", "bootstrap", "bundled"])) {
    throw new GradleException("Unsupported Ominal runtime delivery profile: " + runtimeDelivery)
}
def buildConfigString = { String value ->
    '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

android {
    namespace "com.ominal"

    sourceSets.main.jniLibs.srcDir generatedOminalJniLibs

    if (runtimeDelivery == "legacy") {
        sourceSets.main.assets.srcDir "src/legacy/assets"
    }

    buildFeatures {
        aidl true
    }

    compileSdkVersion project.properties.compileSdkVersion.toInteger()
    ndkVersion = System.getenv("JITPACK_NDK_VERSION") ?: project.properties.ndkVersion
    def apkVersionTag = System.getenv("OMINAL_APK_VERSION_TAG") ?: ""

    dependencies {
        implementation "androidx.annotation:annotation:1.9.0"
        implementation "androidx.core:core:1.13.1"
        implementation "androidx.core:core-splashscreen:1.2.0"
        implementation "androidx.drawerlayout:drawerlayout:1.2.0"
        implementation "androidx.preference:preference:1.2.1"
        implementation "androidx.viewpager:viewpager:1.0.0"
        implementation "com.google.android.material:material:1.12.0"
        implementation "com.google.guava:guava:24.1-jre"
        implementation "io.noties.markwon:core:$markwonVersion"
        implementation "io.noties.markwon:ext-latex:$markwonVersion"
        implementation "io.noties.markwon:ext-strikethrough:$markwonVersion"
        implementation "io.noties.markwon:inline-parser:$markwonVersion"
        implementation "io.noties.markwon:linkify:$markwonVersion"
        implementation "io.noties.markwon:recycler:$markwonVersion"
        implementation("io.noties.markwon:syntax-highlight:$markwonVersion") {
            exclude group: "org.jetbrains", module: "annotations-java5"
        }
        annotationProcessor "io.noties:prism4j-bundler:2.0.0"
        implementation 'com.google.guava:listenablefuture:9999.0-empty-to-avoid-conflict-with-guava'

        implementation project(":terminal-view")
        implementation project(":ominal-shared")
    }

    defaultConfig {
        applicationId project.ext.ominalAppPackageName
        minSdkVersion project.properties.minSdkVersion.toInteger()
        targetSdkVersion project.properties.targetSdkVersion.toInteger()
        versionCode appVersionCode
        versionName appVersionName

        ndk {
            abiFilters 'arm64-v8a'
        }

        validateVersionName(versionName)

        buildConfigField "String", "OMINAL_PACKAGE_VARIANT", "\"" + project.ext.packageVariant + "\"" // Used by OminalApplication class
        buildConfigField "String", "OMINAL_RUNTIME_DELIVERY", buildConfigString(runtimeDelivery)
        buildConfigField "String", "OMINAL_PREPARED_ROOTFS_URL", buildConfigString(preparedRootfsUrl)
        buildConfigField "String", "OMINAL_PREPARED_ROOTFS_SHA256", buildConfigString(preparedRootfsSha256)
        buildConfigField "String", "OMINAL_PREPARED_ROOTFS_ASSET", buildConfigString(preparedRootfsAsset)

        manifestPlaceholders.OMINAL_PACKAGE_NAME = project.ext.ominalAppPackageName
        manifestPlaceholders.OMINAL_APP_NAME = "Monolith"
        manifestPlaceholders.OMINAL_API_APP_NAME = "Ominal:API"
        manifestPlaceholders.OMINAL_BOOT_APP_NAME = "Ominal:Boot"
        manifestPlaceholders.OMINAL_FLOAT_APP_NAME = "Ominal:Float"
        manifestPlaceholders.OMINAL_STYLING_APP_NAME = "Ominal:Styling"
        manifestPlaceholders.OMINAL_TASKER_APP_NAME = "Ominal:Tasker"
        manifestPlaceholders.OMINAL_WIDGET_APP_NAME = "Ominal:Widget"

        externalNativeBuild {
            ndkBuild {
                cFlags "-std=c11", "-Wall", "-Wextra", "-Werror", "-Os", "-fno-stack-protector", "-Wl,--gc-sections"
            }
        }

    }

    signingConfigs {
        debug {
            storeFile file('testkey_untrusted.jks')
            keyAlias 'alias'
            storePassword 'xrj45yWGLbsO7W0v'
            keyPassword 'xrj45yWGLbsO7W0v'
        }

        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseSigningProperties.getProperty("storeFile"))
                storePassword releaseSigningProperties.getProperty("storePassword")
                keyAlias releaseSigningProperties.getProperty("keyAlias")
                keyPassword releaseSigningProperties.getProperty("keyPassword")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources false // Reproducible builds
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }

        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        // Flag to enable support for the new language APIs
        coreLibraryDesugaringEnabled true

        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        ndkBuild {
            path "src/main/cpp/Android.mk"
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging true
        }
    }

    if (runtimeDelivery == "bundled") {
        assetPacks = [":ominal-runtime-pack"]
    }

    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            if (variant.buildType.name == "debug") {
                outputFileName = new File("monolith-v" + appVersionCode + "-dev.apk")
            } else if (variant.buildType.name == "release") {
                def abi = output.getFilter(com.android.build.OutputFile.ABI)
                outputFileName = new File("ominal-app_" + (apkVersionTag ? apkVersionTag : project.ext.packageVariant + "-" + "release") + "_" + (abi ? abi : "arm64-v8a") + ".apk")
            }
        }
    }

    buildFeatures {
        buildConfig true
    }
}

def prepareOminalProotLoader = tasks.register("prepareOminalProotLoader") {
    inputs.file(ominalBootstrapAarch64)
    outputs.file(generatedProotLoader)
    doLast {
        if (!ominalBootstrapAarch64.isFile()) {
            throw new GradleException("Missing source-built Ominal bootstrap: " + ominalBootstrapAarch64)
        }
        File loader = zipTree(ominalBootstrapAarch64).matching {
            include "libexec/proot/loader"
        }.singleFile
        File target = generatedProotLoader.get().asFile
        target.parentFile.mkdirs()
        target.bytes = loader.bytes
    }
}

tasks.configureEach { task ->
    if (task.name.endsWith("JniLibFolders")) {
        task.dependsOn(prepareOminalProotLoader)
    }
}

tasks.register("validateReleaseSigning") {
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException("Missing release signing configuration at .signing/keystore.properties")
        }
    }
}

tasks.register("validateReleaseRuntime") {
    doLast {
        if (runtimeDelivery == "legacy") {
            throw new GradleException("Release bundles require -PominalRuntimeDelivery=bootstrap or bundled")
        }
        if (!(preparedRootfsSha256 ==~ /[0-9a-f]{64}/)) {
            throw new GradleException("A 64-character ominalPreparedRootfsSha256 is required")
        }
        if (runtimeDelivery == "bootstrap" && !preparedRootfsUrl.startsWith("https://")) {
            throw new GradleException("Bootstrap bundles require an HTTPS ominalPreparedRootfsUrl")
        }
        if (runtimeDelivery == "bundled") {
            File preparedAsset = rootProject.file("ominal-runtime-pack/src/main/assets/" + preparedRootfsAsset)
            if (!preparedAsset.isFile()) {
                throw new GradleException("Bundled runtime asset is missing: " + preparedAsset)
            }
        }
    }
}

def versionChangelogDirectory =
    rootProject.file("fastlane/metadata/android/en-US/changelogs")
def versionChangelogFile = new File(versionChangelogDirectory, appVersionCode + ".txt")
tasks.register("verifyVersioning") {
    inputs.file(versionPropertiesFile)
    inputs.dir(versionChangelogDirectory)
    doLast {
        if (!versionChangelogFile.isFile()
            || versionChangelogFile.getText("UTF-8").trim().isEmpty()) {
            throw new GradleException(
                "Missing release changelog for version code " + appVersionCode + ": "
                    + versionChangelogFile)
        }
        def recordedCodes = versionChangelogDirectory.listFiles()
            .findAll { it.isFile() && it.name ==~ /\d+\.txt/ }
            .collect { it.name.substring(0, it.name.length() - 4).toInteger() }
        def highestRecordedCode = recordedCodes.isEmpty() ? 0 : recordedCodes.max()
        if (highestRecordedCode != appVersionCode) {
            throw new GradleException(
                "version.properties code " + appVersionCode
                    + " must match the newest changelog code " + highestRecordedCode)
        }
    }
}

def playPermissionAllowlist = [
    "android.permission.ACCESS_NETWORK_STATE",
    "android.permission.INTERNET",
    "android.permission.WAKE_LOCK",
    "android.permission.VIBRATE",
    "android.permission.FOREGROUND_SERVICE",
    "android.permission.FOREGROUND_SERVICE_SPECIAL_USE",
    "android.permission.POST_NOTIFICATIONS",
    project.ext.ominalAppPackageName + ".DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
] as Set

tasks.register("verifyPlayPolicyManifest") {
    dependsOn("processReleaseMainManifest")
    doLast {
        def manifestFiles = fileTree(new File(buildDir, "intermediates")) {
            include "merged_manifest/release/**/AndroidManifest.xml"
            include "merged_manifests/release/**/AndroidManifest.xml"
        }.files
        if (manifestFiles.isEmpty()) {
            throw new GradleException("Could not locate the merged release AndroidManifest.xml")
        }

        File manifest = manifestFiles.max { it.lastModified() }
        String manifestText = manifest.getText("UTF-8")
        def matcher = manifestText =~ /<uses-permission(?:-sdk-\d+)?\b[^>]*android:name="([^"]+)"/
        Set<String> declared = matcher.collect { it[1] } as Set
        Set<String> unexpected = new TreeSet<>(declared)
        unexpected.removeAll(playPermissionAllowlist)
        if (!unexpected.isEmpty()) {
            throw new GradleException(
                "Merged release manifest contains permissions outside the Play allowlist: " + unexpected)
        }
        if (manifestText.contains("android:requestLegacyExternalStorage=\"true\"")) {
            throw new GradleException("Merged release manifest enables legacy external storage")
        }
        logger.lifecycle("Verified Play permission allowlist: " + new TreeSet<>(declared))
    }
}

tasks.configureEach { task ->
    if (task.name == "preBuild") {
        task.dependsOn("verifyVersioning")
    } else if (task.name == "preReleaseBuild") {
        task.dependsOn("validateReleaseSigning")
        task.dependsOn("validateReleaseRuntime")
    } else if (task.name == "assembleRelease" || task.name == "bundleRelease") {
        task.dependsOn("verifyPlayPolicyManifest")
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16.1"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:1.1.5"
}

task versionName {
    doLast {
        print android.defaultConfig.versionName
    }
}

task versionCode {
    doLast {
        print android.defaultConfig.versionCode
    }
}

def validateVersionName(String versionName) {
    // https://semver.org/spec/v2.0.0.html#is-there-a-suggested-regular-expression-regex-to-check-a-semver-string
    // ^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$
    if (!java.util.regex.Pattern.matches("^(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-((?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\\.(?:0|[1-9]\\d*|\\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\\+([0-9a-zA-Z-]+(?:\\.[0-9a-zA-Z-]+)*))?\$", versionName))
        throw new GradleException("The versionName '"  + versionName + "' is not a valid version as per semantic version '2.0.0' spec in the format 'major.minor.patch(-prerelease)(+buildmetadata)'. https://semver.org/spec/v2.0.0.html.")
}

def downloadBootstrap(String arch, String expectedChecksum, String version, boolean useLocalBootstraps) {
    def digest = java.security.MessageDigest.getInstance("SHA-256")

    def localUrl = "src/main/cpp/bootstrap-" + arch + ".zip"
    def file = new File(projectDir, localUrl)
    if (file.exists()) {
        if (useLocalBootstraps) {
            return
        }

        def buffer = new byte[8192]
        def input = new FileInputStream(file)
        while (true) {
            def readBytes = input.read(buffer)
            if (readBytes < 0) break
            digest.update(buffer, 0, readBytes)
        }
        def checksum = new BigInteger(1, digest.digest()).toString(16)
        while (checksum.length() < 64) { checksum = "0" + checksum }
        if (checksum == expectedChecksum) {
            return
        } else {
            logger.quiet("Deleting old local file with wrong hash: " + localUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
            file.delete()
        }
    }

    if (useLocalBootstraps) {
        throw new GradleException("Missing local source-built Ominal bootstrap archive: " + localUrl)
    }

    def remoteUrl = "https://github.com/snashoan/ominal/releases/download/bootstrap-" + version + "/bootstrap-" + arch + ".zip"
    logger.quiet("Downloading " + remoteUrl + " ...")

    file.parentFile.mkdirs()
    def out = new BufferedOutputStream(new FileOutputStream(file))

    def connection = new URL(remoteUrl).openConnection()
    connection.setInstanceFollowRedirects(true)
    def digestStream = new java.security.DigestInputStream(connection.inputStream, digest)
    out << digestStream
    out.close()

    def checksum = new BigInteger(1, digest.digest()).toString(16)
    while (checksum.length() < 64) { checksum = "0" + checksum }
    if (checksum != expectedChecksum) {
        file.delete()
        throw new GradleException("Wrong checksum for " + remoteUrl + ": expected: " + expectedChecksum + ", actual: " + checksum)
    }
}

clean {
    doLast {
        if (!useLocalOminalBootstraps) {
            def tree = fileTree(new File(projectDir, 'src/main/cpp'))
            tree.include 'bootstrap-*.zip'
            tree.each { it.delete() }
        }
    }
}

task downloadBootstraps() {
    doLast {
        def packageVariant = project.ext.packageVariant
        if (packageVariant == "apt-android-7") {
            def version = "2026.02.12-r1" + "%2B" + "apt.android-7"
            downloadBootstrap("aarch64", "ea2aeba8819e517db711f8c32369e89e7c52cee73e07930ff91185e1ab93f4f3", version, useLocalOminalBootstraps)
        } else if (packageVariant == "apt-android-5") {
            def version = "2022.04.28-r6" + "+" + packageVariant
            downloadBootstrap("aarch64", "913609d439415c828c5640be1b0561467e539cb1c7080662decaaca2fb4820e7", version, useLocalOminalBootstraps)
        } else {
            throw new GradleException("Unsupported OMINAL_PACKAGE_VARIANT \"" + packageVariant + "\"")
        }
    }
}

def scanBootstrapArchivePrefixes = { File zipFile, List<String> forbiddenPrefixes, String requiredPrefix ->
    def forbiddenCounts = forbiddenPrefixes.collectEntries { [(it): 0] }
    def requiredCount = 0
    def entryNames = new LinkedHashSet<String>()
    def zip = new java.util.zip.ZipFile(zipFile)
    try {
        zip.entries().each { entry ->
            if (entry.isDirectory()) return
            entryNames.add(entry.name)
            def entryText = new String(zip.getInputStream(entry).bytes, "ISO-8859-1")
            forbiddenPrefixes.each { prefix ->
                if (entryText.contains(prefix)) forbiddenCounts[prefix]++
            }
            if (entryText.contains(requiredPrefix)) requiredCount++
        }
    } finally {
        zip.close()
    }
    return [forbiddenCounts: forbiddenCounts, requiredCount: requiredCount, entryNames: entryNames]
}

task validateOminalBootstraps() {
    dependsOn downloadBootstraps
    doLast {
        def appPackageName = project.ext.ominalAppPackageName
        def architectures = ["aarch64"]
        def legacyPackageName = "com." + ["t", "e", "r", "m", "u", "x"].join("")
        def forbiddenPrefixes = ["/data/data/" + legacyPackageName, "/data/user/0/" + legacyPackageName]
        def requiredPrefix = "/data/data/" + appPackageName + "/files/usr"
        def requiredRuntimeEntries = [
            "bin/bash",
            "bin/proot",
            "libexec/proot/loader",
            "lib/libtermux-exec-ld-preload.so"
        ]
        def checksumManifest = new File(projectDir, "src/main/cpp/bootstrap-ominal.sha256")
        def expectedHashes = [:]
        def failures = []

        if (!checksumManifest.exists()) {
            failures.add(checksumManifest.name + " is missing")
        } else {
            checksumManifest.eachLine { line ->
                def trimmed = line.trim()
                if (!trimmed.isEmpty() && !trimmed.startsWith("#")) {
                    def parts = trimmed.split("\\s+", 2)
                    if (parts.length != 2) {
                        failures.add(checksumManifest.name + " has invalid line: " + line)
                    } else {
                        expectedHashes[parts[1]] = parts[0].toLowerCase(Locale.ROOT)
                    }
                }
            }
        }

        architectures.each { arch ->
            def archive = new File(projectDir, "src/main/cpp/bootstrap-" + arch + ".zip")
            if (!archive.exists()) {
                failures.add(archive.name + " is missing")
                return
            }

            def scan = scanBootstrapArchivePrefixes(archive, forbiddenPrefixes, requiredPrefix)
            def forbiddenHits = scan.forbiddenCounts.findAll { it.value > 0 }
            if (!forbiddenHits.isEmpty()) {
                failures.add(archive.name + " contains forbidden prefixes: " + forbiddenHits)
            }
            if (scan.requiredCount == 0) {
                failures.add(archive.name + " does not contain expected Ominal prefix: " + requiredPrefix)
            }
            def missingRuntimeEntries = requiredRuntimeEntries.findAll { !scan.entryNames.contains(it) }
            if (!missingRuntimeEntries.isEmpty()) {
                failures.add(archive.name + " is missing required Ominal runtime entries: " + missingRuntimeEntries)
            }

            if (expectedHashes.containsKey(archive.name)) {
                def digest = java.security.MessageDigest.getInstance("SHA-256")
                archive.withInputStream { input ->
                    byte[] buffer = new byte[8192]
                    int readBytes
                    while ((readBytes = input.read(buffer)) > 0) {
                        digest.update(buffer, 0, readBytes)
                    }
                }
                def actualHash = new BigInteger(1, digest.digest()).toString(16).padLeft(64, "0")
                if (actualHash != expectedHashes[archive.name]) {
                    failures.add(archive.name + " SHA-256 mismatch: expected " + expectedHashes[archive.name] + ", actual " + actualHash)
                }
            } else if (checksumManifest.exists()) {
                failures.add(archive.name + " is missing from " + checksumManifest.name)
            }
        }

        if (!failures.isEmpty()) {
            throw new GradleException("Invalid bootstrap archives for " + appPackageName + ". Rebuild the Ominal bootstrap set with TERMUX_APP__PACKAGE_NAME=" + appPackageName + " instead of patching zip binaries.\n - " + failures.join("\n - "))
        }
    }
}

afterEvaluate {
    android.applicationVariants.all { variant ->
        variant.javaCompileProvider.get().dependsOn(validateOminalBootstraps)
    }
}
