<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">GIR clean spiral line experiment</title>
  <desc id="desc">A simple line version of the GIR mark, built from four square spiral arms with no extra folding lines.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f3f5" />
      <stop offset="1" stop-color="#ff4d8d" />
    </linearGradient>
    <path id="arm" d="M128 128V54H194V120H154V82H180" />
  </defs>
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <g stroke="#f2f3f5" stroke-width="13">
      <use href="#arm" />
      <use href="#arm" transform="rotate(90 128 128)" />
      <use href="#arm" transform="rotate(180 128 128)" />
      <use href="#arm" transform="rotate(270 128 128)" />
    </g>
    <g stroke="url(#accent)" stroke-width="3.5" opacity=".9">
      <use href="#arm" />
      <use href="#arm" transform="rotate(90 128 128)" />
      <use href="#arm" transform="rotate(180 128 128)" />
      <use href="#arm" transform="rotate(270 128 128)" />
    </g>
  </g>
</svg>
