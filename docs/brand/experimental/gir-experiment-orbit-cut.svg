<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">GIR orbit spiral experiment</title>
  <desc id="desc">The GIR four-arm spiral with a restrained broken orbit around the unchanged core.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#a5f3fc" />
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="128" cy="128" r="91" stroke="#67e8f9" stroke-opacity=".16" stroke-width="2" stroke-dasharray="1 11" />
    <path d="M64 83A88 88 0 0 1 104 46M152 46A88 88 0 0 1 192 83M192 173A88 88 0 0 1 152 210M104 210A88 88 0 0 1 64 173" stroke="#cffafe" stroke-opacity=".42" stroke-width="3" />
    <path d="M76 62A92 92 0 0 1 93 53M163 53A92 92 0 0 1 180 62M180 194A92 92 0 0 1 163 203M93 203A92 92 0 0 1 76 194" stroke="#22d3ee" stroke-opacity=".78" stroke-width="4" />
    <path id="arm" d="M128 128V50H198V122H151V78H184" stroke="#ecfeff" stroke-width="12" stroke-linecap="square" stroke-linejoin="miter" />
    <use href="#arm" transform="rotate(90 128 128)" />
    <use href="#arm" transform="rotate(180 128 128)" />
    <use href="#arm" transform="rotate(270 128 128)" />
    <path id="arm-accent" d="M128 128V50H198V122H151V78H184" stroke="url(#accent)" stroke-width="3.5" stroke-linecap="square" stroke-linejoin="miter" />
    <use href="#arm-accent" transform="rotate(90 128 128)" />
    <use href="#arm-accent" transform="rotate(180 128 128)" />
    <use href="#arm-accent" transform="rotate(270 128 128)" />
  </g>
</svg>
