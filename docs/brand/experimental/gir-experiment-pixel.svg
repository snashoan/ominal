<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">GIR pixel spiral experiment</title>
  <desc id="desc">A heavier one-color geometric version of the four-arm GIR spiral using square joins and caps.</desc>
  <defs>
    <path id="arm" d="M128 128V58H190V118H154V86H178" />
  </defs>
  <g fill="none" stroke="#f2f3f5" stroke-width="15" stroke-linecap="square" stroke-linejoin="miter">
    <use href="#arm" />
    <use href="#arm" transform="rotate(90 128 128)" />
    <use href="#arm" transform="rotate(180 128 128)" />
    <use href="#arm" transform="rotate(270 128 128)" />
  </g>
</svg>
