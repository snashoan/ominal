name: "Bug report"
description: "Report a reproducible Ominal problem"
title: "[Bug]: "
labels: ["bug report"]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before filing a new report. Ominal currently
        supports ARM64 devices running Android 10 or newer.
  - type: textarea
    attributes:
      label: Problem description
      description: |
        Describe what failed and attach relevant logs, screenshots, or a short
        screen recording. Remove account credentials and private workspace data.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: |
        Include the exact actions and commands needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Expected behavior
  - type: textarea
    attributes:
      label: System information
      description: Please provide info about your device
      value: |
        * Ominal version:
        * Android OS version:
        * Device model:
        * Runtime delivery (legacy/bootstrap/bundled):
    validations:
      required: true
