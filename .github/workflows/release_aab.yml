name: Release Android App Bundles

on:
  workflow_dispatch:
    inputs:
      runtime_tag:
        description: GitHub release tag used for the prepared runtime asset
        required: true
        default: runtime-desktop-xfce-v1
      bootstrap_tag:
        description: GitHub release tag containing bootstrap-aarch64.zip
        required: true
      bootstrap_sha256:
        description: SHA-256 of the source-built ARM64 Ominal bootstrap
        required: true
      upload_to_play:
        description: Upload the bundled-runtime AAB to Google Play internal testing
        required: true
        type: boolean
        default: false
      play_release_status:
        description: Google Play release status
        required: true
        type: choice
        options:
          - completed
          - draft
          - inProgress
          - halted
        default: completed
      validate_play_upload:
        description: Validate the Play upload without publishing it
        required: true
        type: boolean
        default: false
permissions:
  contents: write

jobs:
  runtime:
    runs-on: ubuntu-latest
    outputs:
      sha256: ${{ steps.runtime.outputs.sha256 }}
      filename: ${{ steps.runtime.outputs.filename }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install ARM64 execution support
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user-static binfmt-support
          sudo update-binfmts --enable qemu-aarch64

      - name: Build sanitized prepared rootfs
        id: runtime
        shell: bash
        run: |
          filename=ominal-ubuntu-24.04.4-arm64-prepared-v3.tgz
          sudo bash tools/build-prepared-rootfs.sh "build/runtime/$filename"
          sudo chown -R "$USER:$USER" build/runtime
          sha256="$(sha256sum "build/runtime/$filename" | awk '{print $1}')"
          printf '%s  %s\n' "$sha256" "$filename" > "build/runtime/$filename.sha256"
          echo "filename=$filename" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Upload runtime build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ominal-prepared-runtime
          path: |
            build/runtime/${{ steps.runtime.outputs.filename }}
            build/runtime/${{ steps.runtime.outputs.filename }}.sha256
          compression-level: 0

      - name: Publish checksum-pinned runtime asset
        env:
          GH_TOKEN: ${{ github.token }}
          RUNTIME_TAG: ${{ inputs.runtime_tag }}
          RUNTIME_FILE: build/runtime/${{ steps.runtime.outputs.filename }}
        run: |
          if ! gh release view "$RUNTIME_TAG" >/dev/null 2>&1; then
            gh release create "$RUNTIME_TAG" --title "Ominal prepared runtime" \
              --notes "Sanitized ARM64 runtime generated from pinned Ubuntu, Node, and Codex inputs."
          fi
          if gh release download "$RUNTIME_TAG" --pattern "$(basename "$RUNTIME_FILE")" \
              --dir build/published-runtime --clobber; then
            echo "${{ steps.runtime.outputs.sha256 }}  $(basename "$RUNTIME_FILE")" \
              | (cd build/published-runtime && sha256sum --check --status -)
          else
            gh release upload "$RUNTIME_TAG" "$RUNTIME_FILE" "$RUNTIME_FILE.sha256"
          fi

  bundles:
    needs: runtime
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        delivery: [bootstrap, bundled]
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download checksum-pinned Ominal bootstrap
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_TAG: ${{ inputs.bootstrap_tag }}
          BOOTSTRAP_SHA256: ${{ inputs.bootstrap_sha256 }}
        run: |
          [[ "$BOOTSTRAP_SHA256" =~ ^[0-9a-fA-F]{64}$ ]]
          target=app/src/main/cpp
          mkdir -p "$target"
          gh release download "$BOOTSTRAP_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern bootstrap-aarch64.zip --dir "$target"
          bootstrap_sha256="${BOOTSTRAP_SHA256,,}"
          printf '%s  %s\n' "$bootstrap_sha256" bootstrap-aarch64.zip \
            > "$target/bootstrap-ominal.sha256"
          (cd "$target" && sha256sum --check --strict bootstrap-ominal.sha256)

      - name: Download prepared runtime
        uses: actions/download-artifact@v6
        with:
          name: ominal-prepared-runtime
          path: build/runtime

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Read and validate canonical version
        id: version
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:verifyVersioning
          echo "name=$(./gradlew -q :app:versionName)" >> "$GITHUB_OUTPUT"
          echo "code=$(./gradlew -q :app:versionCode)" >> "$GITHUB_OUTPUT"

      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.OMINAL_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.OMINAL_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.OMINAL_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.OMINAL_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          mkdir -p .signing
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .signing/ominal-upload.jks
          {
            echo "storeFile=.signing/ominal-upload.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > .signing/keystore.properties

      - name: Prepare bundled asset pack
        if: matrix.delivery == 'bundled'
        run: |
          target=ominal-runtime-pack/src/main/assets/runtime/archives
          mkdir -p "$target"
          cp "build/runtime/${{ needs.runtime.outputs.filename }}" "$target/"

      - name: Build signed ${{ matrix.delivery }} AAB
        env:
          RUNTIME_URL: https://github.com/${{ github.repository }}/releases/download/${{ inputs.runtime_tag }}/${{ needs.runtime.outputs.filename }}
          RUNTIME_SHA256: ${{ needs.runtime.outputs.sha256 }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon bundleRelease \
            -PominalRuntimeDelivery=${{ matrix.delivery }} \
            -PominalPreparedRootfsUrl="$RUNTIME_URL" \
            -PominalPreparedRootfsSha256="$RUNTIME_SHA256"
          mkdir -p release
          output="release/ominal-${{ steps.version.outputs.name }}-v${{ steps.version.outputs.code }}-${{ matrix.delivery }}.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$output"
          sha256sum "$output" > "$output.sha256"
          if unzip -l "$output" | grep -Fq "base/assets/runtime/archives/"; then
            echo "Release AAB unexpectedly contains a legacy runtime archive" >&2
            exit 1
          fi
          if [[ "${{ matrix.delivery }}" == bundled ]]; then
            unzip -l "$output" | grep -F "ominal_runtime/assets/runtime/archives/${{ needs.runtime.outputs.filename }}"
          elif unzip -l "$output" | grep -Fq "ominal_runtime/assets/runtime/archives/"; then
            echo "Bootstrap AAB unexpectedly contains the prepared runtime" >&2
            exit 1
          fi

      - name: Upload signed ${{ matrix.delivery }} AAB
        uses: actions/upload-artifact@v7
        with:
          name: ominal-${{ steps.version.outputs.name }}-v${{ steps.version.outputs.code }}-${{ matrix.delivery == 'bundled' && 'play' || 'direct-test' }}-aab
          path: |
            release/ominal-${{ steps.version.outputs.name }}-v${{ steps.version.outputs.code }}-${{ matrix.delivery }}.aab
            release/ominal-${{ steps.version.outputs.name }}-v${{ steps.version.outputs.code }}-${{ matrix.delivery }}.aab.sha256
            app/build/outputs/mapping/release/mapping.txt
          compression-level: 0

      - name: Set up Ruby and Fastlane
        if: matrix.delivery == 'bundled' && inputs.upload_to_play
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Restore Google Play service account
        if: matrix.delivery == 'bundled' && inputs.upload_to_play
        env:
          PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.OMINAL_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
        run: |
          test -n "$PLAY_SERVICE_ACCOUNT_BASE64"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_BASE64" \
            | base64 --decode > .signing/play-service-account.json
          jq -e '.type == "service_account" and (.client_email | length > 0)' \
            .signing/play-service-account.json >/dev/null

      - name: Upload bundled AAB to Play internal testing
        if: matrix.delivery == 'bundled' && inputs.upload_to_play
        env:
          GOOGLE_PLAY_JSON_KEY: ${{ github.workspace }}/.signing/play-service-account.json
        run: |
          bundle exec fastlane android internal \
            aab:"$PWD/release/ominal-${{ steps.version.outputs.name }}-v${{ steps.version.outputs.code }}-bundled.aab" \
            status:${{ inputs.play_release_status }} \
            validate:${{ inputs.validate_play_upload }}
